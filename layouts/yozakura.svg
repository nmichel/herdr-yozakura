<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Yozakura's shoji look, in the yugure theme: wooden frames around indigo washi. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4870"/><stop offset="0.5" stop-color="#3d3f59"/><stop offset="1" stop-color="#34364b"/>
    </linearGradient>
    <radialGradient id="halo" cx="113" cy="15" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6d4c0" stop-opacity="0.32"/><stop offset="1" stop-color="#eab4c4" stop-opacity="0"/>
    </radialGradient>
    <!-- A rail of chestnut: lighter at the top, a darker edge at the bottom, grain along it. -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5543"/><stop offset="0.25" stop-color="#55422f"/>
      <stop offset="0.7" stop-color="#4b3a2b"/><stop offset="1" stop-color="#3a2c20"/>
    </linearGradient>
    <pattern id="grain" width="40" height="3" patternUnits="userSpaceOnUse">
      <path d="M0 0.9 Q10 0.5 20 1 T40 0.9" fill="none" stroke="#2f2318" stroke-opacity="0.35" stroke-width="0.25"/>
      <path d="M0 2.2 Q14 2.6 26 2 T40 2.2" fill="none" stroke="#7a644e" stroke-opacity="0.3" stroke-width="0.2"/>
    </pattern>
  </defs>

  <!-- dusk sky, moon, a cherry branch across the top -->
  <rect width="160" height="100" rx="6" fill="url(#sky)"/>
  <circle cx="113" cy="15" r="16" fill="url(#halo)"/>
  <circle cx="113" cy="15" r="4.5" fill="#fbefd9" fill-opacity="0.42"/>
  <path d="M162 2 C150 2 140 6 128 8 S108 9 98 12" fill="none" stroke="#1a1a26" stroke-opacity="0.85" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M128 8 C125 10 122 12 118 13" fill="none" stroke="#1a1a26" stroke-opacity="0.85" stroke-width="0.6" stroke-linecap="round"/>
  <g fill="#f4c0cc">
    <circle cx="99" cy="11.5" r="1.1"/><circle cx="104" cy="10.4" r="1.3"/><circle cx="110" cy="9.8" r="1"/>
    <circle cx="116" cy="9.4" r="1.3"/><circle cx="119" cy="12.6" r="1.1"/><circle cx="123" cy="8.4" r="1.2"/>
    <circle cx="131" cy="7" r="1.1"/><circle cx="136" cy="5.6" r="1.3"/><circle cx="146" cy="3.6" r="1.2"/><circle cx="152" cy="2.6" r="1"/>
  </g>
  <g fill="#eeaabb" fill-opacity="0.6">
    <ellipse cx="108" cy="17" rx="0.9" ry="0.5" transform="rotate(30 108 17)"/>
    <ellipse cx="125" cy="18" rx="0.8" ry="0.5" transform="rotate(-20 125 18)"/>
  </g>

  <!-- every card: indigo washi in a chestnut frame, nearly square -->
  <g fill="#2a2d3d" stroke="#4d3b2c" stroke-width="1.2">
    <rect x="4.6" y="15.6" width="32.8" height="32.8" rx="0.8"/>
    <rect x="4.6" y="52.6" width="32.8" height="29.8" rx="0.8"/>
    <rect x="4.6" y="86.6" width="32.8" height="8.8" rx="0.8"/>
    <rect x="128.6" y="4.6" width="26.8" height="5.8" rx="0.8"/>
    <rect x="41.6" y="22.6" width="54.8" height="62.8" rx="0.8"/>
    <rect x="100.6" y="22.6" width="54.8" height="62.8" rx="0.8"/>
    <rect x="41.6" y="89.6" width="113.8" height="5.8" rx="0.8"/>
  </g>
  <!-- tab thumbnails: paper plaques, the shown ones framed in pink -->
  <g fill="#2a2d3d" stroke="#4d3b2c" stroke-width="0.8">
    <rect x="41.4" y="4.4" width="27.2" height="6.2" rx="0.8" stroke="#efb0c0"/>
    <rect x="71.4" y="4.4" width="21.2" height="6.2" rx="0.8"/>
    <rect x="41.4" y="13.4" width="23.2" height="5.2" rx="0.8" stroke="#efb0c0"/>
    <rect x="67.4" y="13.4" width="17.2" height="5.2" rx="0.8"/>
  </g>

  <!-- rails of grained wood: the brand card, the Spaces and Agents headers, the panes' headers -->
  <g>
    <rect x="4" y="4" width="34" height="8" rx="1" fill="url(#wood)"/>
    <rect x="5.2" y="16.2" width="31.6" height="5" fill="url(#wood)"/>
    <rect x="5.2" y="53.2" width="31.6" height="5" fill="url(#wood)"/>
    <rect x="42.2" y="23.2" width="53.6" height="5" fill="url(#wood)"/>
    <rect x="101.2" y="23.2" width="53.6" height="5" fill="url(#wood)"/>
  </g>
  <g fill="url(#grain)">
    <rect x="4" y="4" width="34" height="8" rx="1"/>
    <rect x="5.2" y="16.2" width="31.6" height="5"/>
    <rect x="5.2" y="53.2" width="31.6" height="5"/>
    <rect x="42.2" y="23.2" width="53.6" height="5"/>
    <rect x="101.2" y="23.2" width="53.6" height="5"/>
  </g>
  <g fill="#22180f">
    <rect x="5.2" y="21" width="31.6" height="0.3"/>
    <rect x="5.2" y="58" width="31.6" height="0.3"/>
    <rect x="101.2" y="28" width="53.6" height="0.3"/>
  </g>
  <!-- the focused pane: an accent line under its rail -->
  <rect x="42.2" y="28" width="53.6" height="0.6" fill="#efb0c0"/>

  <!-- ink on the wood -->
  <g fill="#f1e8d8">
    <rect x="8" y="7" width="12" height="2" rx="1"/>
    <rect x="8" y="17.8" width="9" height="1.6" rx="0.8"/>
    <rect x="8" y="54.8" width="9" height="1.6" rx="0.8"/>
    <rect x="45" y="24.8" width="14" height="1.6" rx="0.8"/>
    <rect x="104" y="24.8" width="10" height="1.6" rx="0.8" fill-opacity="0.75"/>
  </g>
  <!-- names on the plaques -->
  <rect x="45" y="6.6" width="16" height="1.8" rx="0.9" fill="#efb0c0"/>
  <rect x="75" y="6.6" width="12" height="1.8" rx="0.9" fill="#c3bcb0"/>
  <rect x="45" y="15.1" width="14" height="1.8" rx="0.9" fill="#efb0c0"/>
  <rect x="71" y="15.1" width="9" height="1.8" rx="0.9" fill="#c3bcb0"/>

  <!-- spaces -->
  <rect x="7" y="24" width="28" height="7" rx="0.8" fill="#3a3d51"/>
  <rect x="9" y="26" width="3" height="3" rx="0.8" fill="#4a8c84"/>
  <rect x="14" y="26.5" width="12" height="2" rx="1" fill="#ebe4d6"/>
  <rect x="9" y="34" width="3" height="3" rx="0.8" fill="#b97446"/>
  <rect x="14" y="34.5" width="14" height="2" rx="1" fill="#a29c93"/>
  <rect x="9" y="41" width="3" height="3" rx="0.8" fill="#4f72a6"/>
  <rect x="14" y="41.5" width="10" height="2" rx="1" fill="#a29c93"/>
  <!-- agent cards: the shown one outlined, the working one with its dancer -->
  <rect x="7" y="61" width="28" height="9.5" rx="0.8" fill="#34374a" stroke="#efb0c0" stroke-width="0.5"/>
  <rect x="9" y="63" width="14" height="2" rx="1" fill="#ebe4d6"/>
  <rect x="9" y="66.8" width="18" height="1.4" rx="0.7" fill="#a29c93"/>
  <circle cx="31" cy="64.5" r="2.2" fill="#d3cbbb"/>
  <rect x="7" y="72" width="28" height="8.5" rx="0.8" fill="#30334a"/>
  <rect x="9" y="74" width="14" height="2" rx="1" fill="#c3bcb0"/>
  <circle cx="32" cy="77.5" r="1" fill="#a3cc9c"/>
  <!-- footer -->
  <rect x="8" y="89.6" width="14" height="1.6" rx="0.8" fill="#c3bcb0"/>
  <!-- terminal lines on the washi -->
  <g fill="#ebe4d6" fill-opacity="0.38">
    <rect x="45" y="33" width="38" height="1.5" rx="0.75"/>
    <rect x="45" y="37" width="30" height="1.5" rx="0.75"/>
    <rect x="45" y="41" width="42" height="1.5" rx="0.75"/>
    <rect x="45" y="45" width="24" height="1.5" rx="0.75"/>
    <rect x="104" y="33" width="26" height="1.5" rx="0.75"/>
    <rect x="104" y="37" width="34" height="1.5" rx="0.75"/>
    <rect x="104" y="41" width="20" height="1.5" rx="0.75"/>
  </g>
  <!-- status bar -->
  <g fill="#c3bcb0">
    <rect x="45" y="91.8" width="18" height="1.4" rx="0.7"/>
    <rect x="66" y="91.8" width="12" height="1.4" rx="0.7"/>
    <rect x="132" y="91.8" width="20" height="1.4" rx="0.7"/>
  </g>
</svg>
