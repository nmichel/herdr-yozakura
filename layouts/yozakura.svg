<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262940"/><stop offset="0.6" stop-color="#1c1e2c"/><stop offset="1" stop-color="#14151d"/>
    </linearGradient>
    <radialGradient id="halo" cx="114" cy="14" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dcc8" stop-opacity="0.28"/><stop offset="1" stop-color="#e9b9c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- night sky, moon, petals -->
  <rect width="160" height="100" rx="6" fill="url(#sky)"/>
  <circle cx="114" cy="14" r="18" fill="url(#halo)"/>
  <circle cx="114" cy="13" r="4.5" fill="#f1dcc0" fill-opacity="0.4"/>
  <g fill="#e9a3b5" fill-opacity="0.55">
    <ellipse cx="118" cy="9" rx="1.2" ry="0.7" transform="rotate(30 118 9)"/>
    <ellipse cx="130" cy="27" rx="1.1" ry="0.6" transform="rotate(-20 130 27)"/>
    <ellipse cx="96" cy="6" rx="1" ry="0.6" transform="rotate(50 96 6)"/>
  </g>
  <g fill="#1c1e29" fill-opacity="0.88" stroke="#3b3a52" stroke-width="0.6">
    <!-- sidebar: brand, spaces, agents, footer -->
    <rect x="4" y="4" width="34" height="8" rx="3"/>
    <rect x="4" y="15" width="34" height="34" rx="4"/>
    <rect x="4" y="52" width="34" height="31" rx="4"/>
    <rect x="4" y="86" width="34" height="10" rx="3"/>
    <!-- desktops row, actions card -->
    <rect x="41" y="4" width="28" height="7" rx="3.5" stroke="#e9a3b5"/>
    <rect x="71" y="4" width="22" height="7" rx="3.5"/>
    <rect x="128" y="4" width="28" height="7" rx="3.5"/>
    <!-- panels row -->
    <rect x="41" y="13" width="24" height="6" rx="3" stroke="#e9a3b5"/>
    <rect x="67" y="13" width="18" height="6" rx="3"/>
    <!-- two panels, status bar -->
    <rect x="41" y="22" width="56" height="64" rx="4"/>
    <rect x="100" y="22" width="56" height="64" rx="4"/>
    <rect x="41" y="89" width="115" height="7" rx="3"/>
  </g>
  <!-- the focused panel's header, tinted with the accent -->
  <path d="M41 26a4 4 0 0 1 4-4h48a4 4 0 0 1 4 4v3h-56z" fill="#e9a3b5" fill-opacity="0.32"/>
  <rect x="41" y="29" width="56" height="0.6" fill="#e9a3b5"/>
  <g fill="#ddd5c5">
    <rect x="8" y="7" width="12" height="2" rx="1"/>
    <rect x="45" y="6.5" width="16" height="2" rx="1" fill="#e9a3b5"/>
    <rect x="75" y="6.5" width="12" height="2" rx="1" fill-opacity="0.6"/>
    <rect x="45" y="15" width="14" height="2" rx="1" fill="#e9a3b5"/>
    <rect x="71" y="15" width="9" height="2" rx="1" fill-opacity="0.6"/>
    <rect x="45" y="24.5" width="14" height="2" rx="1"/>
    <rect x="104" y="24.5" width="10" height="2" rx="1" fill-opacity="0.6"/>
  </g>
  <!-- spaces -->
  <rect x="7" y="20" width="28" height="7" rx="3" fill="#3b3a52"/>
  <rect x="9" y="22" width="3" height="3" rx="1" fill="#e9a3b5"/>
  <rect x="14" y="22.5" width="12" height="2" rx="1" fill="#ddd5c5"/>
  <rect x="9" y="31" width="3" height="3" rx="1" fill="#7fbcb4"/>
  <rect x="14" y="31.5" width="14" height="2" rx="1" fill="#74778a"/>
  <!-- agent cards: the working one has its dancer -->
  <rect x="7" y="57" width="28" height="11" rx="2.5" fill="#3b3a52" stroke="#e9a3b5" stroke-width="0.5"/>
  <rect x="9" y="59.5" width="14" height="2" rx="1" fill="#ddd5c5"/>
  <rect x="9" y="63.5" width="18" height="1.5" rx="0.75" fill="#74778a"/>
  <circle cx="31" cy="61" r="2.2" fill="#c9c1b1"/>
  <rect x="7" y="70" width="28" height="11" rx="2.5" fill="#262838"/>
  <rect x="9" y="72.5" width="14" height="2" rx="1" fill="#ddd5c5" fill-opacity="0.6"/>
  <circle cx="32" cy="77" r="1" fill="#94bf8e"/>
  <!-- terminal lines -->
  <g fill="#ddd5c5" fill-opacity="0.35">
    <rect x="45" y="34" width="38" height="1.5" rx="0.75"/>
    <rect x="45" y="38" width="30" height="1.5" rx="0.75"/>
    <rect x="45" y="42" width="42" height="1.5" rx="0.75"/>
    <rect x="104" y="34" width="26" height="1.5" rx="0.75"/>
    <rect x="104" y="38" width="34" height="1.5" rx="0.75"/>
  </g>
</svg>
